<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f6" />
    <meta
      name="description"
      content="Инспектор ИИ — интеллектуальный сервис проверки строительной документации"
    />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Инспектор ИИ" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Инспектор ИИ</title>
    <script>
      (() => {
        let selectedTheme = null;

        try {
          const themeKey = "inspector-ai:theme:v1";
          const parseTheme = (value) => {
            if (value === null) return null;
            try {
              return JSON.parse(value);
            } catch {
              return value;
            }
          };
          const storedTheme = parseTheme(localStorage.getItem(themeKey));

          if (storedTheme === "light" || storedTheme === "dark") {
            selectedTheme = storedTheme;
          }
        } catch {
          // The dark default remains available when storage is blocked.
        }

        if (!selectedTheme) return;

        const root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(selectedTheme);
        root.dataset.theme = selectedTheme;
      })();
    </script>
    <style>
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #08090d;
        }
      }
      @media (prefers-color-scheme: light) {
        html {
          background-color: #f8f9fc;
        }
      }

      html[data-theme="dark"] {
        background-color: #08090d;
      }
      html[data-theme="light"] {
        background-color: #f8f9fc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
